name: CI

on:
  pull_request:
    # Draft PRs can receive any number of pushes without starting runners.
    # Mark the PR ready once the change is coherent, or dispatch manually.
    types: [opened, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to validate (defaults to the selected workflow ref)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core (Linux, Node ${{ matrix.node-version }})
    if: >-
      github.actor == 'xiaotianfotos' &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login == 'xiaotianfotos' &&
         github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs validate the primary runtime, main validates compatibility, and
        # a manual run retains the complete compatibility matrix.
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '[24]' || github.event_name == 'push' && '[20]' || '[20,24]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            homerail_protocol/package-lock.json
            homerail_manager/package-lock.json
            homerail_node/package-lock.json
            homerail_worker/package-lock.json
            homerail_cli/package-lock.json
            agent-ui/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Typecheck, build, and test
        env:
          HOMERAIL_HOME: ${{ runner.temp }}/homerail-ci-node-${{ matrix.node-version }}
        run: npm run ci

  core-windows:
    name: Core (Windows, Node 24)
    if: >-
      github.actor == 'xiaotianfotos' &&
      (github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    # A cold Windows dependency install can consume roughly six minutes before
    # the serialized cross-platform suite starts. Keep every package enabled
    # while leaving enough bounded headroom for hosted-runner variance.
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            homerail_protocol/package-lock.json
            homerail_manager/package-lock.json
            homerail_node/package-lock.json
            homerail_worker/package-lock.json
            homerail_cli/package-lock.json
            agent-ui/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Typecheck, build, and test
        env:
          HOMERAIL_HOME: ${{ runner.temp }}/homerail-ci
          # Windows filesystem and process startup contention makes parallel
          # Vitest files and SQLite-heavy tests prone to unrelated short-test
          # timeouts. Serialize files and retain bounded Windows-only margins.
          VITEST_MAX_WORKERS: "1"
          VITEST_TEST_TIMEOUT: "15000"
          VITEST_HOOK_TIMEOUT: "30000"
        run: npm run ci

  agent-ui-coverage:
    name: Agent UI coverage
    if: >-
      github.actor == 'xiaotianfotos' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'xiaotianfotos' &&
        github.event.pull_request.draft == false) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            homerail_protocol/package-lock.json
            agent-ui/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix homerail_protocol ci
          npm --prefix homerail_protocol run build
          npm --prefix agent-ui ci

      - name: Run full-source coverage
        run: npm --prefix agent-ui run test:coverage

  docker-smoke:
    name: Docker smoke
    if: >-
      github.actor == 'xiaotianfotos' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'xiaotianfotos' &&
        github.event.pull_request.draft == false) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: homerail_node/package-lock.json

      - name: Install Node dependencies
        run: npm --prefix homerail_node ci

      - name: Run real Docker lifecycle test
        env:
          DOCKER_TEST: "1"
        run: npm --prefix homerail_node test -- src/providers/__tests__/docker-cli-provider.integration.test.ts

      - name: Build Worker image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t homerail-worker:ci -f homerail_worker/Dockerfile .

      - name: Exercise packaged DeepSeek Harness runtime
        run: >-
          docker run --rm --user root --workdir /app --entrypoint npm homerail-worker:ci
          test -- --run src/__tests__/deepseek-harness-runtime.integration.test.ts
