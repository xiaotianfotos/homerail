name: Desktop Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unified version, for example 0.1.0-alpha.1
        type: string
        required: true
      desktop_sha:
        description: Full homerail_desktop commit SHA to build
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-candidate
  cancel-in-progress: false

env:
  HOMERAIL_NODE_VERSION: v24.18.0
  RELEASE_NODE_VERSION: 24.18.0

jobs:
  prepare:
    name: Validate immutable candidate inputs
    if: github.actor == 'xiaotianfotos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out HomeRail source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: homerail-source
          persist-credentials: false

      - name: Validate release version and desktop commit
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DESKTOP_SHA: ${{ inputs.desktop_sha }}
        run: |
          set -euo pipefail
          numeric='(0|[1-9][0-9]*)'
          core="${numeric}\.${numeric}\.${numeric}"
          if [[ "$REQUESTED_VERSION" =~ ^${core}-(alpha|beta)(\.${numeric})+$ ]]; then
            channel="${BASH_REMATCH[4]}"
            prerelease=true
          elif [[ "$REQUESTED_VERSION" =~ ^${core}$ ]]; then
            channel=latest
            prerelease=false
          else
            echo "version must look like 0.1.0-alpha.1, 0.1.0-beta.1, or 0.1.0" >&2
            exit 1
          fi
          if [[ ! "$DESKTOP_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "desktop_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          printf 'version=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify unified public package versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          node homerail-source/scripts/desktop-release/validate-unified-version.mjs
          --public-root homerail-source
          --version "$RELEASE_VERSION"

  build:
    name: Build signed candidate (${{ matrix.label }})
    needs: prepare
    environment:
      name: desktop-beta-signing
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            platform: windows
            artifact: desktop-release-windows-x64
          - label: macOS arm64
            os: macos-15
            platform: macos
            artifact: desktop-release-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HOMERAIL_SOURCE_DIR: ${{ github.workspace }}/homerail-source
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Check out HomeRail runtime source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: homerail-source
          persist-credentials: false

      - name: Check out pinned private desktop shell
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: xiaotianfotos/homerail_desktop
          ref: ${{ inputs.desktop_sha }}
          token: ${{ secrets.HOMERAIL_DESKTOP_READ_TOKEN }}
          path: desktop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            homerail-source/homerail_protocol/package-lock.json
            homerail-source/homerail_plugin_sdk/package-lock.json
            homerail-source/homerail_manager/package-lock.json
            homerail-source/homerail_node/package-lock.json
            homerail-source/homerail_worker/package-lock.json
            homerail-source/homerail_cli/package-lock.json
            homerail-source/agent-ui/package-lock.json

      - name: Verify unified public and desktop versions
        run: >-
          node homerail-source/scripts/desktop-release/validate-unified-version.mjs
          --public-root homerail-source
          --desktop-root desktop
          --version "$RELEASE_VERSION"

      - name: Verify Desktop commit is merged to main
        shell: bash
        env:
          DESKTOP_SHA: ${{ inputs.desktop_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git -C desktop rev-parse HEAD)" != "$DESKTOP_SHA" ]]; then
            echo "Desktop checkout does not match the requested commit" >&2
            exit 1
          fi
          if ! git -C desktop merge-base --is-ancestor "$DESKTOP_SHA" origin/main; then
            echo "desktop_sha must already be merged to homerail_desktop main" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: |
          npm --prefix desktop ci
          npm --prefix homerail-source run install:all

      - name: Run public Windows Node 24 CI
        if: runner.os == 'Windows'
        env:
          HOMERAIL_HOME: ${{ runner.temp }}/homerail-candidate-public-ci
          VITEST_MAX_WORKERS: "1"
          VITEST_TEST_TIMEOUT: "15000"
          VITEST_HOOK_TIMEOUT: "30000"
        run: npm --prefix homerail-source run ci

      - name: Verify public Windows CLI release version
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cliVersion = (& node homerail-source/homerail_cli/dist/cli.js --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Built HomeRail CLI exited with $LASTEXITCODE"
          }
          if ($cliVersion -ne $env:EXPECTED_VERSION) {
            throw "Built CLI version $cliVersion does not match $env:EXPECTED_VERSION"
          }

      - name: Run Desktop Windows CI
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          HOMERAIL_HOME: ${{ runner.temp }}/homerail-candidate-desktop-ci
        run: npm run ci

      - name: Build and sign Windows installer
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: >-
          npm run dist -- --win nsis --x64 --publish never
          --config.forceCodeSigning=true
          --config.publish.channel="$env:RELEASE_CHANNEL"

      - name: Prepare and verify Windows update metadata
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadataReleaseChannel = if ($env:RELEASE_CHANNEL -eq 'latest') {
            'stable'
          } else {
            $env:RELEASE_CHANNEL
          }
          npm run verify:update-metadata -- --dist dist-electron --channel $metadataReleaseChannel --platform windows
          if ($LASTEXITCODE -ne 0) {
            throw "Windows update metadata verification failed"
          }

      - name: Verify Windows package and signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm --prefix desktop run verify:package
          $installers = @(Get-ChildItem -Path desktop/dist-electron -Filter *.exe -File)
          if ($installers.Count -eq 0) { throw "No Windows installer was produced" }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($null -eq $signature.SignerCertificate) {
              throw "Missing Authenticode signature: $($installer.Name)"
            }
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($installer.Name): $($signature.Status)"
            }
            Write-Host "Signed installer: $($installer.Name) ($($signature.Status))"
          }

      - name: Write Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $metadataNames = if ($env:RELEASE_CHANNEL -eq 'latest') {
            @('latest.yml', 'alpha.yml', 'beta.yml')
          } else {
            @("$env:RELEASE_CHANNEL.yml")
          }
          $files = @(Get-ChildItem -Path desktop/dist-electron -File | Where-Object {
            $_.Name -match '\.(exe|blockmap)$' -or $_.Name -in $metadataNames
          } | Sort-Object Name)
          if ($files.Count -eq 0) { throw "No Windows release assets were produced" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path desktop/dist-electron) 'SHA256SUMS-windows.txt'),
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Smoke-test silent Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path desktop/dist-electron -Filter *.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP "homerail-nsis-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $installRoot = Join-Path $smokeRoot 'install'
          $profileRoot = Join-Path $smokeRoot 'profile'
          $electronUserData = Join-Path $profileRoot 'electron-user-data'
          $env:USERPROFILE = $profileRoot
          $env:APPDATA = Join-Path $profileRoot 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $profileRoot 'AppData\Local'
          $env:HOMERAIL_HOME = Join-Path $profileRoot '.homerail'
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA, $env:HOMERAIL_HOME | Out-Null

          $appProcess = $null
          try {
            $installProcess = Start-Process `
              -FilePath $installers[0].FullName `
              -ArgumentList @('/S', "/D=$installRoot") `
              -PassThru `
              -Wait `
              -WindowStyle Hidden
            if ($installProcess.ExitCode -ne 0) {
              throw "Silent NSIS installation failed with exit code $($installProcess.ExitCode)"
            }

            $appPath = Join-Path $installRoot 'HomeRail.exe'
            $nodePath = Join-Path $installRoot 'resources\node-bin\node.exe'
            $cliPath = Join-Path $installRoot 'resources\homerail-runtime\homerail_cli\dist\cli.js'
            foreach ($required in @($appPath, $nodePath, $cliPath)) {
              if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
                throw "Silent NSIS installation is missing $required"
              }
            }

            $cliVersion = (& $nodePath $cliPath --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "Installed HomeRail CLI exited with $LASTEXITCODE"
            }
            if ($cliVersion -ne $env:EXPECTED_VERSION) {
              throw "Installed CLI version $cliVersion does not match $env:EXPECTED_VERSION"
            }

            $appProcess = Start-Process `
              -FilePath $appPath `
              -ArgumentList @("--user-data-dir=$electronUserData") `
              -PassThru `
              -WindowStyle Hidden
            Start-Sleep -Seconds 12
            if ($appProcess.HasExited) {
              throw "Installed HomeRail exited during the bounded startup smoke with code $($appProcess.ExitCode)"
            }
            Write-Host "Installed HomeRail remained alive for the bounded startup smoke"
          } finally {
            if ($null -ne $appProcess -and -not $appProcess.HasExited) {
              Stop-Process -Id $appProcess.Id -Force
              $appProcess.WaitForExit()
            }

            $uninstaller = Join-Path $installRoot 'Uninstall HomeRail.exe'
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $uninstallProcess = Start-Process `
                -FilePath $uninstaller `
                -ArgumentList @('/S') `
                -PassThru `
                -Wait `
                -WindowStyle Hidden
              if ($uninstallProcess.ExitCode -ne 0) {
                throw "Silent NSIS uninstall failed with exit code $($uninstallProcess.ExitCode)"
              }
            }
          }

          $uninstallDeadline = [DateTime]::UtcNow.AddSeconds(20)
          while (
            (Test-Path -LiteralPath (Join-Path $installRoot 'HomeRail.exe')) -and
            [DateTime]::UtcNow -lt $uninstallDeadline
          ) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath (Join-Path $installRoot 'HomeRail.exe')) {
            throw "Silent NSIS uninstall left HomeRail.exe installed"
          }

      - name: Install Apple notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/homerail-notarization.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A -out "$key_path"
          chmod 0600 "$key_path"
          printf 'APPLE_API_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize macOS app
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          npm run dist -- --mac dmg zip --arm64 --publish never
          --config.forceCodeSigning=true
          --config.mac.notarize=true
          --config.mac.entitlements="$GITHUB_WORKSPACE/homerail-source/scripts/desktop-release/entitlements.mac.plist"
          --config.mac.entitlementsInherit="$GITHUB_WORKSPACE/homerail-source/scripts/desktop-release/entitlements.mac.plist"
          --config.publish.channel="$RELEASE_CHANNEL"

      - name: Prepare and verify macOS update metadata
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          metadata_release_channel="$RELEASE_CHANNEL"
          if [[ "$metadata_release_channel" == "latest" ]]; then
            metadata_release_channel=stable
          fi
          npm run verify:update-metadata -- \
            --dist dist-electron \
            --channel "$metadata_release_channel" \
            --platform macos

      - name: Verify macOS package, signature, and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix desktop run verify:package
          app_path="$(find desktop/dist-electron -type d -name HomeRail.app -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No HomeRail.app was produced" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Remove Apple notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            rm -f "$APPLE_API_KEY"
          fi

      - name: Write macOS checksums
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/dist-electron
          metadata_names=("${RELEASE_CHANNEL}-mac.yml")
          if [[ "$RELEASE_CHANNEL" == "latest" ]]; then
            metadata_names=("latest-mac.yml" "alpha-mac.yml" "beta-mac.yml")
          fi
          asset_list="$RUNNER_TEMP/homerail-macos-release-assets.txt"
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) -print > "$asset_list"
          for metadata_name in "${metadata_names[@]}"; do
            if [[ ! -f "$metadata_name" ]]; then
              echo "Missing macOS update metadata: $metadata_name" >&2
              exit 1
            fi
            printf './%s\n' "$metadata_name" >> "$asset_list"
          done
          sort -u "$asset_list" -o "$asset_list"
          if [[ ! -s "$asset_list" ]]; then
            echo "No macOS release assets were produced" >&2
            exit 1
          fi
          : > SHA256SUMS-macos.txt
          while IFS= read -r asset; do
            asset_name="${asset#./}"
            shasum -a 256 "$asset_name" >> SHA256SUMS-macos.txt
          done < "$asset_list"

      - name: Upload Windows candidate assets
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist-electron/*.exe
            desktop/dist-electron/*.blockmap
            desktop/dist-electron/*.yml
            desktop/dist-electron/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS candidate assets
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist-electron/*.dmg
            desktop/dist-electron/*.zip
            desktop/dist-electron/*.blockmap
            desktop/dist-electron/*.yml
            desktop/dist-electron/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble immutable candidate
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: homerail-source
          persist-credentials: false

      - name: Download Windows candidate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: desktop-release-windows-x64
          path: candidate/release-assets/windows

      - name: Download macOS candidate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: desktop-release-macos-arm64
          path: candidate/release-assets/macos

      - name: Create release manifest and verify candidate boundary
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          DESKTOP_SHA: ${{ inputs.desktop_sha }}
        run: >-
          node homerail-source/scripts/desktop-release/release-candidate.mjs create
          --candidate-dir candidate
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --channel "$RELEASE_CHANNEL"
          --source-commit "$GITHUB_SHA"
          --desktop-commit "$DESKTOP_SHA"
          --run-id "$GITHUB_RUN_ID"

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 30

      - name: Record candidate handoff
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## Desktop $RELEASE_VERSION candidate"
            echo
            echo "Candidate run ID: \`$GITHUB_RUN_ID\`"
            echo
            echo "Download \`desktop-release-candidate\`, complete direct-install checks on Windows and macOS, then dispatch **Desktop Release Publish** with this run ID. No Git tag or public release exists yet."
          } >> "$GITHUB_STEP_SUMMARY"
