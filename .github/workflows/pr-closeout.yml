name: HomeRail PR Closeout

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        type: number
        required: true
      phase:
        description: Closeout phase
        type: choice
        options: [draft, merge]
        required: true
      validation_run:
        description: Matching HomeRail validation or PR Review run id
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: homerail-pr-closeout-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  closeout:
    name: HomeRail PR Closeout
    if: github.actor == 'xiaotianfotos'
    runs-on: [self-hosted, Linux, X64, homerail-pr-review]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Verify stable runner environment
        id: stable
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOMERAIL_STABLE_ROOT:-}"
          test -n "${HOMERAIL_STABLE_HOME:-}"
          test -n "${HOMERAIL_STABLE_MANAGER_URL:-}"
          stable_release="$(readlink -f "$HOMERAIL_STABLE_ROOT/current")"
          node_bin="$stable_release/runtime/node"
          test "$stable_release" != "$HOMERAIL_STABLE_ROOT/current"
          test -x "$node_bin"
          test -f "$stable_release/REVISION"
          test -f "$stable_release/assets/orchestrations/pr-closeout.yaml.template"
          test -f "$stable_release/homerail_cli/dist/cli.js"
          test -f "$stable_release/scripts/lib/stable-automation-runtime.sh"
          artifact_dir="$RUNNER_TEMP/homerail-pr-closeout-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"
          echo "HOMERAIL_PR_CLOSEOUT_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "release=$stable_release" >> "$GITHUB_OUTPUT"
          echo "node=$node_bin" >> "$GITHUB_OUTPUT"

      - name: Start deterministic closeout
        id: closeout
        shell: bash
        env:
          CLOSEOUT_PR: ${{ inputs.pr }}
          CLOSEOUT_PHASE: ${{ inputs.phase }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: |
          set -euo pipefail
          artifact_dir="$HOMERAIL_PR_CLOSEOUT_ARTIFACT_DIR"
          "${{ steps.stable.outputs.node }}" --input-type=module <<'NODE'
          import fs from 'node:fs'
          const input = {
            repo: process.env.GITHUB_REPOSITORY,
            pr: Number(process.env.CLOSEOUT_PR),
            phase: process.env.CLOSEOUT_PHASE,
          }
          if (process.env.VALIDATION_RUN) input.validation_runs = [process.env.VALIDATION_RUN]
          fs.writeFileSync(`${process.env.HOMERAIL_PR_CLOSEOUT_ARTIFACT_DIR}/input.json`, JSON.stringify(input))
          NODE

          # The stable helper reads the Manager mutation token from its 0600
          # runtime file. GitHub receives neither the token nor the file path.
          source "${{ steps.stable.outputs.release }}/scripts/lib/stable-automation-runtime.sh"
          initialize_stable_automation_runtime
          stable_hr dag sync pr-closeout >/dev/null
          args=(--json dag run-template pr-closeout --input "$(cat "$artifact_dir/input.json")")
          if [ "$CLOSEOUT_PHASE" = "draft" ]; then args+=(--wait --timeout 600); fi
          stable_hr "${args[@]}" > "$artifact_dir/command.json.tmp"
          mv "$artifact_dir/command.json.tmp" "$artifact_dir/command.json"
          RUN_ID="$("${{ steps.stable.outputs.node }}" -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).run_id)' "$artifact_dir/command.json")"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ "$CLOSEOUT_PHASE" = "draft" ]; then
            stable_hr dag artifact "$RUN_ID" pr-closeout.json --output "$artifact_dir/pr-closeout.json"
          fi

      - name: Publish closeout summary
        if: always()
        shell: bash
        run: |
          node_bin="${{ steps.stable.outputs.node }}"
          if [ ! -x "$node_bin" ]; then
            node_bin="$(command -v node || true)"
          fi
          if [ -z "$node_bin" ]; then
            printf '# HomeRail PR Closeout\n\nResult: **infrastructure_error**\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$node_bin" --input-type=module <<'NODE'
          import fs from 'node:fs'
          const directory = process.env.HOMERAIL_PR_CLOSEOUT_ARTIFACT_DIR
          const file = `${directory}/command.json`
          const command = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {}
          const artifactFile = `${directory}/pr-closeout.json`
          const artifact = fs.existsSync(artifactFile) ? JSON.parse(fs.readFileSync(artifactFile, 'utf8')) : {}
          const snapshot = artifact.payload ?? command.input?.payload ?? {}
          const lines = [
            '# HomeRail PR Closeout',
            '',
            `Result: **${snapshot.closeout_status ?? 'infrastructure_error'}**`,
            `Run: \`${command.run_id ?? 'not started'}\``,
            `Head: \`${snapshot.head ?? 'unknown'}\``,
            '',
            'This workflow never merges the pull request.',
          ]
          if (Array.isArray(snapshot.blockers) && snapshot.blockers.length) {
            lines.push('', '## Blockers', '', ...snapshot.blockers.map(item => `- \`${item.code}\`: ${item.message}`))
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`)
          NODE

      - name: Upload closeout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-closeout-${{ inputs.pr }}-${{ github.run_id }}
          path: ${{ runner.temp }}/homerail-pr-closeout-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
